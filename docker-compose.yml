version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: chest-disease-backend
    ports:
      - "8000:8000"
    volumes:
      # Persist SQLite history database records
      - ./backend:/app/backend
      # Mount model checkpoints folder to avoid embedding massive weights in image layers
      - ./ml/checkpoints:/app/ml/checkpoints
    environment:
      - ENV=production
      - DEVICE=cpu
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chest-disease-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: always
